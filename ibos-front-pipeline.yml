apiVersion: apps/v1
kind: Deployment
metadata:
  name: #{Deployment}#
spec:
  replicas: 1
  selector:
    matchLabels:
      app: #{Deployment}#
  template:
    metadata:
      labels:
        app: #{Deployment}#
        type: #{Deployment}#
    spec:
      containers:
        - name: #{Deployment}#
          image: iboslimitedbd/#{Deployment}#:#{Build.BuildId}#
          env:
          - name: "NEXT_PUBLIC_CLARITY_ID"
            value: #{NEXT_PUBLIC_CLARITY_ID}#
          - name:  "NEXT_PUBLIC_GSC_VERIFICATION"
            value:  #{NEXT_PUBLIC_GSC_VERIFICATION}#
          - name:  "NEXT_PUBLIC_GA_MEASUREMENT_ID"
            value:  #{NEXT_PUBLIC_GA_MEASUREMENT_ID}#
          - name: "NEXT_PUBLIC_SITE_URL"
            value: #{NEXT_PUBLIC_SITE_URL}#
          - name:  "ADMIN_API_URL"
            value:  #{ADMIN_API_URL}#

      imagePullSecrets:
        - name: dockercred

---
apiVersion: v1
kind: Service
metadata:
  name: #{Deployment}#
spec:
  selector:
    app: #{Deployment}#
  ports:
    - port: 80
      targetPort: 80
  # type: LoadBalancer
  # loadBalancerIP: 172.18.18.56
